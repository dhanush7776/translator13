services:
  # ---------------------------------------------
  # 1. AccessAI Backend API (Node.js Express)
  # ---------------------------------------------
  - type: web
    name: accessai-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: NVIDIA_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ---------------------------------------------
  # 2. AccessAI Frontend Client (Next.js)
  # ---------------------------------------------
  - type: web
    name: accessai-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        sync: false
